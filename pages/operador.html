<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stock Romero · Operario</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="../css/tokens.css"><link rel="stylesheet" href="../css/base.css"><link rel="stylesheet" href="../css/components.css">
</head>
<body>
<nav class="navbar">
  <div class="navbar-brand"><img class="brand-logo" src="https://www.romeropanificados.com.ar/wp-content/uploads/2023/01/Recurso-8.png" alt="Romero Panificados"><h1>Stock Romero</h1></div>
  <div class="navbar-right">
    <div class="user-pill"><div class="user-avatar" id="user-avatar">–</div><div><div class="user-name" id="user-name"></div><div class="user-role">Operario</div></div></div>
    <button class="btn-logout" id="btn-logout">Salir</button>
  </div>
</nav>

<div class="tabs">
  <button class="tab-btn active" data-tab="stock"><svg class="ico" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="14" y="3" rx="1"/><rect width="7" height="7" x="14" y="14" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/></svg><span>Stock actual</span></button>
  <button class="tab-btn" data-tab="salida"><svg class="ico" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"/><path d="m19 12-7 7-7-7"/></svg><span>Registrar salida</span></button>
  <button class="tab-btn" data-tab="historial"><svg class="ico" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/></svg><span>Historial</span></button>
</div>

<div class="content">
  <div class="tab-panel active" id="tab-stock">
    <div id="stats-row" class="stats-row"></div>
    <div class="form-row stock-search-row"><div class="form-group"><label>Buscar producto</label><input id="stock-busqueda" type="search" placeholder="Marca, línea o producto..."></div></div>
    <div class="card">
      <div class="card-header"><div><h2>Stock actual</h2><div id="brand-summary" class="brand-summary"></div></div></div>
      <div id="stock-loading" class="empty-state"><div class="empty-icon">⏳</div><p>Cargando productos...</p></div>
      <div class="table-wrap">
        <table id="stock-table" class="hidden">
          <thead><tr><th>Marca</th><th>Línea</th><th>Producto</th><th>Stock</th><th>Última actualización</th><th></th></tr></thead>
          <tbody id="stock-tbody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <div class="tab-panel" id="tab-salida">
    <div class="card">
      <div class="card-header"><h2>Registrar salida</h2><p style="margin:4px 0 0;color:var(--muted)">Las salidas se registran en bandejas.</p></div>
      <div class="form-row">
        <div class="form-group"><label>Marca</label><select id="mov-marca"><option value="">Seleccioná marca...</option></select></div>
        <div class="form-group"><label>Línea</label><select id="mov-linea"><option value="">Seleccioná línea...</option></select></div>
        <div class="form-group"><label>Producto</label><select id="mov-producto"><option value="">Seleccioná producto...</option></select></div>
        <div class="form-group"><label>Bandejas</label><input type="number" id="mov-cantidad" min="1" step="1" inputmode="numeric" placeholder="0" /></div>
        <div class="form-group" style="flex:0;min-width:auto"><label style="opacity:0">_</label><button class="btn btn-primary" id="btn-registrar">Registrar salida</button></div>
      </div>
      <div id="mov-stock-actual" class="alert alert-info hidden"></div>
      <div id="mov-error" class="alert alert-error hidden"></div>
      <div id="mov-ok" class="alert alert-ok hidden"></div>
    </div>
  </div>

  <div class="tab-panel" id="tab-historial">
    <div id="hist-stats" class="stats-row"></div>
    <div class="card">
      <div class="card-header"><h2>Historial de movimientos</h2></div>
      <div class="form-row" style="margin-bottom:20px">
        <div class="form-group"><label>Buscar producto</label><input id="hist-busqueda" type="search" placeholder="Marca, línea o producto..."></div>
        <div class="form-group"><label>Marca</label><select id="hist-filtro-marca"><option value="">Todas</option></select></div>
        <div class="form-group"><label>Tipo</label>
          <select id="hist-filtro-tipo">
            <option value="">Todos</option>
            <option value="produccion">Producción</option>
            <option value="entrada">Entrada</option>
            <option value="salida">Salida</option>
            <option value="ajuste">Ajuste</option>
          </select>
        </div>
        <div class="form-group"><label>Usuario</label>
          <select id="hist-filtro-usuario">
            <option value="">Todos</option>
            <option value="mios">Solo los míos</option>
          </select>
        </div>
        <div class="form-group"><label>Período</label>
          <select id="hist-filtro-periodo">
            <option value="">Todo</option>
            <option value="hoy">Hoy</option>
            <option value="7">Últimos 7 días</option>
            <option value="30">Últimos 30 días</option>
          </select>
        </div>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Fecha / hora</th><th>Marca</th><th>Línea</th><th>Producto</th><th>Tipo</th><th>Cantidad</th><th>Stock anterior</th><th>Stock final</th><th>Usuario</th><th>Origen</th></tr></thead>
          <tbody id="hist-tbody"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
<script src="../js/core/config.js"></script><script src="../js/core/marcas.js"></script><script src="../js/core/stock-core.js"></script><script src="../js/core/sobrantes-stock.js"></script><script src="../js/core/sincronizacion.js"></script><script src="../js/ui/editor-stock.js"></script><script src="../js/pages/operador.js"></script><script src="../js/ui/ui.js"></script>
</body>
</html>
